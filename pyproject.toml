[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reverseiiiiing"
version = "0.1.0"
description = "TFT auto-player: live state reader + decision engine + optional input executor"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "He" }]
license = { text = "MIT" }

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "mss>=9.0",
    "opencv-python>=4.10",
    "numpy>=1.26",
    "Pillow>=10.3",
    "PyQt6>=6.7",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "aiosqlite>=0.20",
    "rich>=13.7",
    "pynput>=1.7",
    "pytesseract>=0.3.10",
]

[project.optional-dependencies]
win = [
    "pydirectinput>=1.0.4",
    "pywin32>=306",
]
vision = [
    "ultralytics>=8.2",
    "torch>=2.3",
]
mcp = [
    "mcp>=1.0",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
reverseiii = "reverseiiiiing.__main__:main"
reverseiii-mcp = "reverseiiiiing.mcp_server.__main__:main"
reverseiii-scrape = "reverseiiiiing.meta.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
